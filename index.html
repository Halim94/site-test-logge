<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Test Logger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test Logger">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --ink: #14213d; --muted: #6b7686; --line: #e1e5eb;
    --navy: #14213d; --accent: #2a6fdb; --pass: #1e8449; --fail: #c0392b; --cmt: #b9770e; --pend: #8a94a3;
    --pass-bg: #e6f4ea; --fail-bg: #fbe9e7; --cmt-bg: #fdf3e1; --pend-bg: #eef0f3;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1320; --card: #182033; --ink: #e8ecf3; --muted: #9aa5b5; --line: #2a3448;
      --pass-bg: #163a26; --fail-bg: #3d1b18; --cmt-bg: #3a2b12; --pend-bg: #252e40; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 650; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  main { padding: 14px 16px calc(env(safe-area-inset-bottom) + 100px); max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .day { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; letter-spacing: .5px; }
  .test { display: block; width: 100%; text-align: left; border: 0; font: inherit; color: inherit; cursor: pointer; }
  .test .t1 { font-weight: 650; font-size: 16px; }
  .test .t2 { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 650; }
  .Pass { background: var(--pass-bg); color: var(--pass); } .Fail { background: var(--fail-bg); color: var(--fail); }
  .Partial { background: var(--cmt-bg); color: var(--cmt); } .Pending { background: var(--pend-bg); color: var(--pend); }
  .A { background: var(--pass); } .R { background: var(--fail); } .C { background: var(--cmt); }
  .synced { font-size: 12px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 70px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px;
    padding: 12px 16px; font: inherit; font-weight: 650; background: var(--accent); color: #fff; cursor: pointer; }
  .btn.ghost { background: var(--pend-bg); color: var(--ink); }
  .btn.danger { background: var(--fail-bg); color: var(--fail); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  .fab { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 14px); max-width: 688px; margin: 0 auto;
    display: flex; gap: 10px; z-index: 9; }
  .fab .btn { flex: 1; padding: 15px; box-shadow: 0 6px 18px rgba(20,33,61,.25); }
  .tag { border-left: 4px solid var(--pend); }
  .tag.s-Pass { border-left-color: var(--pass); } .tag.s-Fail { border-left-color: var(--fail); }
  .tag h3 { margin: 0; font-size: 16px; }
  .tag .meta { color: var(--muted); font-size: 13px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .seg button.on.pass { color: var(--pass); } .seg button.on.fail { color: var(--fail); } .seg button.on.cmt { color: var(--cmt); }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: var(--bg); border: 0; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb i { position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .thumb .gone { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: var(--muted); }
  .add { border: 2px dashed var(--line); background: transparent; color: var(--accent); font-size: 28px; border-radius: 9px; aspect-ratio: 1; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; }
  .sheet { background: var(--card); width: 100%; max-width: 720px; margin: 0 auto; border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 94vh; overflow: auto; }
  .sheet img { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 10px; background: #000; }
  .muted { color: var(--muted); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 90px); background: var(--navy); color: #fff;
    padding: 10px 16px; border-radius: 12px; z-index: 30; font-size: 14px; max-width: 90%; text-align: center; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .shots-h { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .shot { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 6px 11px; font: inherit; font-size: 13px; }
  .shot.done { border-style: solid; font-weight: 600; }
  .shot.done.A { color: var(--pass); border-color: var(--pass); background: var(--pass-bg); }
  .shot.done.C { color: var(--cmt); border-color: var(--cmt); background: var(--cmt-bg); }
  .shot.done.R { color: var(--fail); border-color: var(--fail); background: var(--fail-bg); }
  .thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 9.5px; line-height: 1.2;
    padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .sync-bar { border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; margin-bottom: 12px; cursor: pointer;
    background: var(--pass-bg); color: var(--pass); }
  .sync-bar.busy { background: var(--pend-bg); color: var(--accent); }
  .sync-bar.offline { background: var(--pend-bg); color: var(--muted); }
  .sync-bar.error { background: var(--fail-bg); color: var(--fail); }
  .shot.form-missing { border-color: var(--cmt); color: var(--cmt); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
<header><button id="back" hidden>‹ Back</button><h1 id="title">Site Test Logger</h1><span id="hdr-right"></span></header>
<main id="view"></main>
<div id="fab" class="fab"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="pick" type="file" accept="image/*" multiple hidden>
<input id="any" type="file" accept="image/*" hidden>
<script src="lib/jszip.min.js"></script>
<script src="lib/xlsx.min.js"></script>
<script src="lib/docx.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
